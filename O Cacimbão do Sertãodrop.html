function hsh(n){n=Math.imul(n^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);return (n^(n>>>16))>>>0}

function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]}return a}

/* ---- calendário e lua ---- */
function dinfo(day){day=day||S.t.day;const d=day-1;const m=Math.floor((d%360)/30);return{m,dom:(d%30)+1,y:Math.floor(d/360)+1,mn:MONTHS[m],se:SEASONS[m]}}
const hr=()=>Math.floor(S.t.min/60);
const absMin=()=>S.t.day*1440+S.t.min;
function clockStr(){const m=Math.floor(S.t.min);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function period(){const h=hr();return h<6?'Madrugada':h<12?'Manhã':h<18?'Tarde':'Noite'}
function isNight(){return darkness()>.55}
function moonPhase(day){return(((day||S.t.day)-1)%30)/30}
function isFull(day){const p=moonPhase(day);return p>=.42&&p<=.58}
function moonName(day){const p=moonPhase(day);return isFull(day)?'Lua cheia':p<.08||p>.92?'Lua nova':p<.5?'Crescente':'Minguante'}
function darkness(){const m=S.t.min;if(m>=420&&m<=1020)return 0;if(m<300||m>=1170)return 1;if(m<420)return 1-(m-300)/120;return(m-1020)/150}

/* ---- clima ---- */
function rollWeather(){const mo=dinfo().m,w=S.w;let rp=RAINP[mo];if(w.dry>25)rp*=.7;let t='sol';const r=rnd();w.rs=w.re=0;w.heat=false;w.cold=false;
 if(r<rp){t=rnd()<.28?'tempestade':'chuva';w.rs=ri(12,17)*60+ri(0,50);w.re=w.rs+(t==='tempestade'?ri(60,120):ri(40,110))}
 else if(r<rp+.14)t='nublado';else if(r<rp+.2)t='ventania';
 if((t==='sol')&&(mo>=8||mo===0)&&rnd()<.08+(w.dry>20?.1:0))w.heat=true;
 if((mo===5||mo===6)&&rnd()<.35)w.cold=true;
 w.type=t}
function raining(){const w=S.w;return(w.type==='chuva'||w.type==='tempestade')&&S.t.min>=w.rs&&S.t.min<w.re}
function rainPower(){return raining()?(S.w.type==='tempestade'?2.2:1):0}
function tempAt(min){const mo=dinfo().m,w=S.w;let hi=TMAX[mo],lo=TMIN[mo];if(w.heat)hi+=5;if(w.type==='chuva'||w.type==='tempestade')hi-=5;else if(w.type==='nublado')hi-=2.5;if(w.cold)lo-=5;if(w.dry>=30)hi+=1.5;
 const h=min/60,f=(h>=5&&h<=23)?Math.sin(Math.PI*(h-5)/18):0;return lo+(hi-lo)*f}
const tempNow=()=>tempAt(S.t.min);
const WNAME={sol:'Sol intenso',nublado:'Céu nublado',chuva:'Chuva passageira',tempestade:'Tempestade',ventania:'Ventania'};
function weatherLabel(){const w=S.w;let n=WNAME[w.type];if(w.type==='sol'&&S.w.dry>=30)n='Seca prolongada';if(w.heat)n='Onda de calor';if((w.type==='chuva'||w.type==='tempestade')&&!raining())n=w.type==='chuva'?'Nuvens carregadas':'Céu ameaçador';if(isNight()&&w.cold&&!raining())n='Noite fria';return n}
function cloudiness(){const w=S.w;return w.type==='nublado'?.65:(w.type==='chuva'||w.type==='tempestade')?(raining()?.9:.5):w.type==='ventania'?.3:.1}

/* ---- inventário ---- */
const count=id=>S.inv[id]||0;
const have=(id,q)=>count(id)>=(q||1);
const invUsed=()=>Object.values(S.inv).reduce((a,b)=>a+b,0);
const invCap=()=>70+(hasBld('deposito')?80:0)+(hasBld('armazem')?200:0)+(S.inv.carrinho?20:0)+(S.p.attrs.for-1)*2;
function add(id,q,force){q=Math.floor(q);if(q<=0)return 0;const room=force?q:Math.min(q,invCap()-invUsed());if(room<=0){note('Inventário cheio! Venda ou guarde algo.','bad');return 0}
 S.inv[id]=(S.inv[id]||0)+room;const it=ITEMS[id];if(it&&it.per){(S.bat[id]=S.bat[id]||[]).push({d:S.t.day,q:room})}
 if(room<q)note('Inventário cheio: só coube '+room+'.','bad');return room}
function remove(id,q){q=q||1;if(!have(id,q))return false;S.inv[id]-=q;if(S.inv[id]<=0)delete S.inv[id];const b=S.bat[id];if(b){let n=q;while(n>0&&b.length){if(b[0].q<=n){n-=b[0].q;b.shift()}else{b[0].q-=n;n=0}}if(!S.inv[id])delete S.bat[id]}return true}
function canPay(c){for(const k in c)if(count(k)<c[k])return false;return true}
function pay(c){if(!canPay(c))return false;for(const k in c)remove(k,c[k]);return true}
function costStr(c){return Object.keys(c).map(k=>(ITEMS[k]?ITEMS[k].i:'')+c[k]+' '+(ITEMS[k]?ITEMS[k].n:k)).join(', ')||'—'}
function costHtml(c){return Object.keys(c).map(k=>'<span class="'+(count(k)>=c[k]?'ok':'no')+'">'+c[k]+'× '+ITEMS[k].n+' ('+count(k)+')</span>').join(' · ')||'<span class="ok">sem custo</span>'}
function freshPct(id){const b=S.bat[id];if(!b||!b.length)return 1;const per=ITEMS[id].per*(hasBld('armazem')?1.6:1);const age=S.t.day-b[0].d;return clamp(1-age/per,0,1)}
function spoil(){const out=[];for(const id in S.bat){const per=ITEMS[id].per*(hasBld('armazem')?1.6:1);const b=S.bat[id];let lost=0;while(b.length&&S.t.day-b[0].d>per){lost+=b[0].q;S.inv[id]-=b[0].q;b.shift()}if(S.inv[id]<=0){delete S.inv[id];delete S.bat[id]}if(lost)out.push(lost+' '+ITEMS[id].n)}if(out.length)note('Estragou: '+out.join(', ')+'.','bad')}

/* ---- água ---- */
function tank(id){return S.tanks[id]}
function addWater(id,L,q){const t=S.tanks[id];const a=Math.max(0,Math.min(L,t.cap-t.l));if(a<=0)return 0;t.q=(t.l*t.q+a*q)/(t.l+a);t.l+=a;return a}
function totalWater(){return S.tanks.cantil.l+S.tanks.cisterna.l+S.tanks.reserv.l}
function takeWater(L,ids,ret){ids=ids||['cisterna','reserv','cantil'];let got=0,qs=0;for(const id of ids){const t=S.tanks[id];const a=Math.min(L-got,t.l);if(a>0){got+=a;qs+=a*t.q;if(!ret)t.l-=a}}return{got,q:got?qs/got:0}}
function takeWaterReal(L,ids){const r=takeWater(L,ids,true);if(r.got+1e-6<L)return null;let need=L;for(const id of(ids||['cisterna','reserv','cantil'])){const t=S.tanks[id];const a=Math.min(need,t.l);t.l-=a;need-=a;if(need<=0)break}return r}
function drinkFrom(id,L){const t=S.tanks[id];const a=Math.min(L,t.l);if(a<=0){note('Sem água aí.','bad');return false}t.l-=a;S.p.th=Math.min(100,S.p.th+a*30);drinkEffect(t.q,a);return true}
function drinkEffect(q,a){if(q<45){const pr=(45-q)/45*.9*Math.min(1,a+.3);if(chance(pr)){S.p.sick=Math.max(S.p.sick,26);note('Água suja! Você passou mal. Tome um remédio ou descanse.','bad')}if(q<20){hurt(3,'água contaminada');note('Intoxicação leve pela água contaminada.','bad')}}}

 S.p.scene='prop';S.p.x=330;S.t.min=Math.min(1439,S.t.min);if(S.wolf.active)endWolf&&endWolf();if(S.well.inside)S.well.inside=false;

/* ---- passagem de tempo ---- */
function advance(mins,ctx){ctx=ctx||{};let left=mins;while(left>0){const st=Math.min(left,10);step(st,ctx);left-=st}}
function inWellNow(){return S.p.scene==='well'}
function step(dt,ctx){
 const t=S.t,p=S.p,hrs=dt/60;const prevH=Math.floor(t.min/60);
 t.min+=dt;if(t.min>=1440){t.min-=1440;t.day++;newDay()}
 const nowH=Math.floor(t.min/60);const tmp=tempNow();const well=inWellNow()||ctx.inWell,indoor=ctx.sleeping||ctx.indoor;
 const work=ctx.work!=null?ctx.work:.2;
 if(p.wolfForm){p.en=Math.max(0,p.en-hrs*8);if(p.en<=0){p.wolfForm=false;note('A transformação terminou: você ficou sem energia.','warn')}}
 const surv=Math.max(.5,1-(p.attrs.sob-1)*.05);
 p.hu-=hrs*(1.3+work*1.3)*surv*(ctx.sleeping?.5:1);
 p.th-=hrs*(2.2+work*1.7)*surv*(well||indoor?1:1+Math.max(0,tmp-30)*.04)*(ctx.sleeping?.6:1)*(p.sick?1.4:1);
 // calor
 if(!well&&!indoor){const hh=t.min/60;if(tmp>=33&&hh>=9&&hh<=17&&!raining()){p.heat+=dt*(.17+(tmp-33)*.05)*(work>.5?1.5:.7)*(p.equip.hat?.65:1)*(p.th<25?1.5:1)*(1-cloudiness()*.5)}else p.heat-=dt*.25}else p.heat-=dt*.6;
 p.heat=clamp(p.heat,0,100);

 if(wellIsDry()||W.stock<1){note('A nascente secou temporariamente. A água deve voltar em '+Math.max(1,W.dryUntil-S.t.day)+' dia(s).','bad');return false}

 if(ropeLen()<W.wdepth+2){note('A corda não alcança a água: precisa de '+(W.wdepth+2)+' m (tem '+ropeLen()+' m).','bad');return false}
 const tid=S.build.reservatorio>0?'reserv':'cantil';const t=S.tanks[tid];if(t.l>=t.cap-.1){note('O reservatório está cheio.','');return false}

 const B=BUCKETS[W.bucket];let mins,en,L,pl=pumpLevel();
 if(pl===3){if(!hasBld('gerador')){note('A bomba elétrica precisa do gerador.','bad');return false}
  if((S.flags.gen||0)<=0){if(have('diesel')){remove('diesel');S.flags.gen=200;note('Gerador abastecido (200 L de bombeamento).','ok')}else{note('Gerador sem diesel.','bad');return false}}

 if(S.p.en<enCost(en)){note('Sem energia para puxar água.','bad');return false}
 L=Math.min(L,W.stock,t.cap-t.l);S.p.en-=enCost(en);advance(mins,{work:pl===3?.2:.9});
 if(pl<2&&chance(S.well.ropes.corda_nylon>0&&S.well.ropes.corda===0?.01:.04)){W.bucket=0;note('A corda arrebentou e o balde caiu no poço! Fabrique outro balde.','bad');if(S.well.ropes.corda>0)S.well.ropes.corda--;else S.well.ropes.corda_nylon--;return false}
 if(pl===3)S.flags.gen-=L;W.stock-=L;const a=addWater(tid,L,wellQ());S.stats.pulled+=a;gainXp(2+a*.2);Sfx.water&&Sfx.water();note('+'+fmt1(a)+' L de água do poço (qualidade '+Math.round(wellQ())+'%).','ok');return true}

 if(!(S.flags.filt>0)){remove('carvao');S.flags.filt=100}const L=Math.min(60,t.l,S.flags.filt);const nq=Math.min(95,t.q+55);t.q=(t.q*(t.l-L)+nq*L)/t.l;S.flags.filt-=L;advance(30,{work:.4});S.p.en-=enCost(1.5);gainXp(3);note('Filtrou '+Math.round(L)+' L. Qualidade média: '+Math.round(t.q)+'%.','ok')}

const PEN={galinha:()=>SLOT.galinheiro,porco:()=>SLOT.chiqueiro,cabra:()=>SLOT.curral};
function syncCrit(){if(S.p.scene!=='prop'){E.crit=[];return}E.crit=E.crit||[];const want=S.animals.length;
 while(E.crit.length>want)E.crit.pop();
 while(E.crit.length<want){const a=S.animals[E.crit.length];E.crit.push({x:PEN[a.t]()+ri(-30,30),vx:0,tm:rnd()*3,dir:1})}
 E.crit.forEach((c,i)=>{const a=S.animals[i];if(a)c.t=a.t})}
function critUpdate(dt){syncCrit();for(const c of E.crit){c.tm-=dt;if(c.tm<=0){c.vx=chance(.4)?0:(rnd()<.5?-1:1)*(c.t==='galinha'?16:10);c.tm=1+rnd()*3;if(c.vx)c.dir=Math.sign(c.vx)}c.x+=c.vx*dt;const cx=PEN[c.t]();c.x=clamp(c.x,cx-42,cx+42);if(Math.abs(c.x-cx)>=42)c.vx=-c.vx}}
function dogUpdate(dt){
 const d=E.dog,D=S.dog,p=S.p;d.anim+=dt;d.t-=dt;if(d.bark>0)d.bark-=dt;if(p.scene==='well'){d.x=wellX()-45;d.st='sit';return}
 if(d.find>0){d.find-=dt;d.st='dig';if(d.find<=0){dogFindDone();d.st='sit'}return}
 if(d.st==='play'&&d.t>0)return;
 const w=E.wolf;
 if(w){if(D.cou>=35&&D.hp>6){const dx=w.x-d.x;d.dir=Math.sign(dx)||d.dir;if(Math.abs(dx)>26){d.x+=Math.sign(dx)*100*dt;d.st='run'}else{d.st='bark';d.bark=.4;d.bt=(d.bt||0)-dt;if(d.bt<=0){d.bt=1.1;w.hp-=3+D.cou/14;if(chance(.2)){D.hp=Math.max(1,D.hp-6);note(D.name+' levou uma patada do bicho!','bad')}dogXp(1)}}return}
  d.st='bark';d.bark=.3;const dx=d.x-w.x;d.x+=Math.sign(dx||1)*40*dt;return}
 const tx=p.x-p.face*30,dx=tx-d.x,dist=Math.abs(dx);d.idle=(d.idle||0)+dt;if(p.walk>0||dist>60)d.idle=0;
 if(dist>150){d.x+=Math.sign(dx)*118*dt;d.st='run';d.dir=Math.sign(dx)}
 else if(dist>34){d.x+=Math.sign(dx)*(p.walk>0&&keys.run?105:68)*dt;d.st='walk';d.dir=Math.sign(dx)}
 else{d.st=d.idle>(D.mood==='hurt'||D.en<30||isNight()&&p.hid?4:6)?(D.mood==='hurt'||D.en<35||isNight()?'sleep':'sit'):'stand';if(d.idle>9&&d.idle<9.1&&chance(.3)){d.bark=.6}}
 if(p.hid&&p.scene==='prop'){d.st=isNight()?'sleep':'sit'}
 d.x=clamp(d.x,12,sceneW(p.scene)-12)}
function attack(){const p=S.p;if(p.scene!=='prop'&&!E.wolf){return}if(p.atk>0||p.hid)return;p.atk=.5;p.atkAnim=.25;const w=E.wolf;const wp=S.p.equip.weapon;
 let rng=S.p.wolfForm?42:30,dmg= S.p.wolfForm?14+S.p.attrs.for:4+S.p.attrs.for*.5;
 if(p.wolfForm){rng=42;dmg=14+p.attrs.for*1.5}else if(wp==='facao'&&have('facao')){rng=40;dmg=11+S.p.attrs.for}else if(wp==='espingarda'&&have('espingarda')){if(have('cartucho')){remove('cartucho');rng=170;dmg=38;fx&&fx.flash('#ffe9a0');Sfx.shot&&Sfx.shot()}else{note('Sem cartuchos!','bad');return}}
 else if(S.tools.foice&&S.tools.foice.dur>0){dmg=6+S.p.attrs.for*.6;rng=32}
 Sfx.swing&&Sfx.swing();if(!w)return;
 const dx=w.x-p.x;if(Math.abs(dx)<=rng&&(Math.sign(dx)===p.face||Math.abs(dx)<12)){w.hp-=dmg;w.x+=Math.sign(dx)*10;w.hitT=.2;w.afraid=Math.max(w.afraid||0,.4);fx&&fx.hit(w.x,GY-16);Sfx.hit&&Sfx.hit();if(w.hp<=0)wolfDefeated()}}
function wolfUpdate(dt){
 const w=E.wolf,p=S.p;if(!w)return;
 if(p.scene!=='prop'){wolfAbstract(false);return}
 w.life+=dt;w.t+=dt;w.cd-=dt;if(w.afraid>0)w.afraid-=dt;if(w.hitT>0)w.hitT-=dt;if(p.atk>0)p.atk-=dt;
 if(S.t.min>=345&&S.t.min<1000&&w.st!=='flee'){w.st='flee';w.dawn=1}
 if(w.life>110&&w.st!=='flee')w.st='flee';
 if(w.hp<=w.mx*.28&&w.st!=='flee'){w.st='flee';w.hurtFlee=true}
 const fireOn=S.fire>0&&S.build.fogueira>0,fx0=SLOT.fogueira;
 if(w.st!=='flee'){if(fireOn&&Math.abs(w.x-fx0)<80)w.afraid=2.5;if(p.light.on&&lightActive()&&!p.hid&&Math.abs(w.x-p.x)<46&&p.light.type!=='lamparina')w.afraid=Math.max(w.afraid,1.2)}

 const fenceUp=S.build.cerca>0&&S.fenceHp>0&&!w.in;const spd=(w.dash>0?190:92)+(S.p.lvl>6?8:0);if(w.dash>0)w.dash-=dt;else if(w.st==='chase'&&chance(dt*.12))w.dash=.5;
 if(w.st==='flee'){const dir=w.x<PROP_W/2?-1:1;w.x+=dir*125*dt;w.face=dir;if(w.x<4||w.x>PROP_W-4){if(w.hurtFlee)wolfRetreat();else{S.wolf.sign='trail';S.wolf.cool=ri(2,4);endWolf()}}return}
 if(!w.in){
  if(!(S.build.cerca>0&&S.fenceHp>0))w.in=true;else{const gx=w.x<PROP_W/2?70:PROP_W-70;const dx=gx-w.x;if(Math.abs(dx)>14){w.x+=Math.sign(dx)*spd*dt;w.face=Math.sign(dx);w.st='approach'}else{w.st='break';w.face=w.x<gx?1:-1;if(w.cd<=0){w.cd=1.4;S.fenceHp-=ri(12,20)*(fireOn?.5:1);fx&&fx.shake(3);Sfx.hit&&Sfx.hit();if(S.fenceHp<=0){S.fenceHp=0;w.in=true;note('A cerca foi destruída! Ele entrou.','bad')}}}return}}
 // dentro da propriedade
 if(!w.target||w.tt<=0||(w.target==='player'&&p.hid)){w.tt=6;const hasA=S.animals.length>0;w.target=!p.hid&&(Math.abs(p.x-w.x)<650||!hasA)?'player':hasA?'pen':'well'}
 w.tt-=dt;
 if(w.target==='player'&&p.hid)w.target='pen';
 let tx=w.target==='player'?p.x:w.target==='pen'?((S.animals[0]&&PEN[S.animals[0].t]())||wellX()):wellX();
 const dx=tx-w.x,dist=Math.abs(dx);
 if(dist>(w.target==='player'?20:40)){w.x+=Math.sign(dx)*spd*dt;w.face=Math.sign(dx);w.st='chase'}
 else{w.st='attack';w.face=Math.sign(dx)||w.face;
  if(w.cd<=0){w.cd=1.4;
   if(w.target==='player'){let dm=ri(9,14)*(p.equip.helmet?.9:1)*(1-(p.attrs.agi-1)*.02);if(have('cruz')&&chance(.35)){note('A cruz de aroeira brilhou: o golpe do lobisomem falhou!','ok')}else{hurt(Math.round(dm),'lobisomem');p.x=clamp(p.x+w.face*26,10,PROP_W-10);fx&&fx.shake(7)}}
   else if(w.target==='pen'&&S.animals.length){if(chance(.7)){const i=ri(0,S.animals.length-1);S.animals.splice(i,1);note('O lobisomem pegou um dos seus animais!','bad');w.acts=(w.acts||0)+1}}
   else if(w.target==='well'){if(S.well.bucket&&chance(.3)){S.well.bucket=0;note('Ele arrancou o balde do cacimbão!','bad')}w.acts=(w.acts||0)+1}
   if(w.acts>=2)w.st='flee'}}

function skyCols(){const m=S.t.min;let i=0;while(i<SKY.length-2&&m>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=(m-a[0])/(b[0]-a[0]);let top=mix(a[1],b[1],t),bot=mix(a[2],b[2],t);
 const cl=cloudiness();const gray=S.w.type==='tempestade'?'#3c4250':'#7b8490';top=mix(top,gray,cl*.55);bot=mix(bot,gray,cl*.45);if(S.w.heat||(S.w.dry>=30&&!isNight()))bot=mix(bot,'#f5c36a',.35);return[top,bot]}

 const d=darkness();if(d>.3){for(let i=0;i<60;i++){const h=hsh(i*91+7),x=h%W,y=(h>>8)%110,tw=Math.sin(gtime()*2+i)*.5+.5;if(tw>.3){cx.globalAlpha=(d-.2)*(.4+tw*.6);R(x,y,1,1,'#fff6d8');cx.globalAlpha=1}}}
 const m=S.t.min;if(m>=330&&m<=1140){const t=(m-330)/810,sx=30+t*(W-60),sy=130-Math.sin(t*Math.PI)*105;const hot=S.w.dry>=30||S.w.heat;const c1=hot?'#fff0a0':'#fff6c0';
  cx.globalAlpha=.18;R(sx-12,sy-12,24,24,'#ffe9a0');R(sx-9,sy-9,18,18,'#ffe9a0');cx.globalAlpha=1;R(sx-6,sy-5,12,10,c1);R(sx-5,sy-6,10,12,c1);R(sx-4,sy-4,8,8,'#fffbe0')}
 if(d>.2){const mt=((m<330?m+1440:m)-1080)/(11*60+30);const mx=40+clamp(mt,0,1)*(W-80),my=110-Math.sin(clamp(mt,0,1)*Math.PI)*80;const ph=moonPhase();

 ridge(cam,.08,58,26,1.3,c1);ridge(cam,.16,38,20,4.1,c2);ridge(cam,.28,22,12,7.7,c3);
